name: Android ARM64 debug
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install SDK tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Exercise native guest interpreter
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp app/src/main/cpp/guest.cpp tests/guest_test.cpp -o "$RUNNER_TEMP/guest-test"
          "$RUNNER_TEMP/guest-test"
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp app/src/main/cpp/{guest,pe}.cpp tests/loader_test.cpp -o "$RUNNER_TEMP/loader-test"
          "$RUNNER_TEMP/loader-test"
      - name: Build debug APK
        run: |
          gradle :app:assembleDebug
      - name: Verify signature, alignment and ARM64 engine
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          unzip -p "$apk" lib/arm64-v8a/libalien_core.so > "$RUNNER_TEMP/core.so"
          readelf -h "$RUNNER_TEMP/core.so" | grep -q AArch64
          readelf -lW "$RUNNER_TEMP/core.so" | awk '$1=="LOAD" { if ($NF!="0x4000" && $NF!="0x10000") exit 1; found=1 } END { if (!found) exit 1 }'
          unzip -p "$apk" assets/doors.exe | cmp - app/src/main/assets/doors.exe
      - uses: actions/upload-artifact@v4
        with:
          name: alien-xbox-genesis-arm64-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android test APK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          gradle --no-daemon -PtestAbi=x86_64 :app:assembleDebug
          python -m pip install websocket-client
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -feature -Vulkan -camera-back none
          disable-animations: true
          script: |
            adb shell wm size 800x1520
            adb shell wm density 320
            adb shell wm user-rotation lock 1
            adb install app/build/outputs/apk/debug/app-debug.apk
            python qa/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alien-teal-android-screenshots
          path: qa-output/*.png
          if-no-files-found: warn
  publish:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 0.3.0]')
    needs: [build, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alien-xbox-genesis-arm64-debug
      - uses: actions/download-artifact@v4
        with:
          name: alien-teal-android-screenshots
          path: screenshots
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk ALIEN-XBOX-0.3.0-arm64-debug.apk
          gh release create v0.3.0 ALIEN-XBOX-0.3.0-arm64-debug.apk screenshots/dashboard.png screenshots/execution.png --target "$GITHUB_SHA" --title "Alien Teal Ultimate 0.3.0" --notes "Android ARM64 debug build with the Genesis homebrew engine. Xbox retail games are unsupported."
